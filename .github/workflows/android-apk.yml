name: Build BUNKER HDR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
          mkdir -p /tmp/android-tools
          unzip -q tools.zip -d /tmp/android-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -a /tmp/android-tools/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept SDK Licenses
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android Project
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'BUNKER-HDR-Android-Project*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR/." .
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/tbliberty27/fuelmanagement/MainActivity.kt

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUNKER-HDR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
