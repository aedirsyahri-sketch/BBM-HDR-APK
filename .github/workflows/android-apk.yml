name: Build BUNKER HDR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Extract Android Project
        run: |
          unzip -q BUNKER-HDR-Android-Project.zip -d extracted
          cp -a extracted/BUNKER-HDR-Android/. .
          test -f app/src/main/assets/index.html

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUNKER-HDR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
