name: Build BUNKER HDR Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          mkdir -p /tmp/android-cmdline
          unzip -q cmdline-tools.zip -d /tmp/android-cmdline
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -r /tmp/android-cmdline/cmdline-tools/. "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Menerima lisensi Android SDK..."

          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "Gagal menerima lisensi Android SDK"
            exit "$SDK_STATUS"
          fi

          echo "Menginstal Android SDK packages..."

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK berhasil disiapkan."

      - name: Setup Gradle 8.9
        shell: bash
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare source project
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'BUNKER-HDR-Android-Project*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -s extracted/BUNKER-HDR-Android/app/src/main/assets/index.html
          cp -a extracted/BUNKER-HDR-Android/. .
          grep -q "liberty_bunker_rob_v3" app/src/main/assets/index.html
          grep -q "applicationId 'com.tbliberty27.fuelmanagement'" app/build.gradle

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUNKER_KEYSTORE_BASE64 }}
        run: |
          set -euxo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bunker-hdr-release.p12"
          test -s "$RUNNER_TEMP/bunker-hdr-release.p12"
          echo "BUNKER_KEYSTORE_PATH=$RUNNER_TEMP/bunker-hdr-release.p12" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          BUNKER_KEYSTORE_PASSWORD: ${{ secrets.BUNKER_KEYSTORE_PASSWORD }}
          BUNKER_KEY_ALIAS: ${{ secrets.BUNKER_KEY_ALIAS }}
          BUNKER_KEY_PASSWORD: ${{ secrets.BUNKER_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BUNKER-HDR-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
