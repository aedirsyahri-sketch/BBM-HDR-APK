
name: Check BUNKER HDR Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          KS_BASE64: ${{ secrets.BUNKER_KEYSTORE_BASE64 }}
          KS_STORE_PASSWORD: ${{ secrets.BUNKER_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BUNKER_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.BUNKER_KEY_PASSWORD }}
        shell: bash
        run: |
          set +x
          set -euo pipefail

          echo "Memeriksa kelengkapan Secrets..."
          test -n "$KS_BASE64" || { echo "GAGAL: Base64 kosong"; exit 1; }
          test -n "$KS_STORE_PASSWORD" || { echo "GAGAL: Password keystore kosong"; exit 1; }
          test -n "$KS_ALIAS" || { echo "GAGAL: Alias kosong"; exit 1; }
          test -n "$KS_KEY_PASSWORD" || { echo "GAGAL: Password alias kosong"; exit 1; }
          echo "OK: Keempat Secrets tersedia."

          KS_FILE="$RUNNER_TEMP/bunker-check.p12"
          CSR_FILE="$RUNNER_TEMP/bunker-check.csr"
          trap 'rm -f "$KS_FILE" "$CSR_FILE"' EXIT

          echo "Memeriksa file Base64..."
          if ! printf '%s' "$KS_BASE64" | base64 --decode > "$KS_FILE" 2>/dev/null; then
            echo "GAGAL: Base64 tidak dapat dibaca."
            exit 1
          fi
          test -s "$KS_FILE" || { echo "GAGAL: File keystore kosong"; exit 1; }
          echo "OK: File keystore berhasil dipulihkan."

          echo "Memeriksa password keystore..."
          if ! keytool -list -keystore "$KS_FILE" -storepass "$KS_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "GAGAL: Password keystore salah atau format file tidak cocok."
            exit 1
          fi
          echo "OK: Password keystore diterima."

          echo "Memeriksa alias..."
          if ! keytool -list -keystore "$KS_FILE" -storepass "$KS_STORE_PASSWORD" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "GAGAL: Alias tidak ditemukan atau tidak dapat dibaca."
            exit 1
          fi
          echo "OK: Alias ditemukan."

          echo "Memeriksa password kunci privat..."
          if ! keytool -certreq -alias "$KS_ALIAS" \
            -keystore "$KS_FILE" \
            -storepass "$KS_STORE_PASSWORD" \
            -keypass "$KS_KEY_PASSWORD" \
            -file "$CSR_FILE" >/dev/null 2>&1; then
            echo "GAGAL: Password kunci privat salah atau kunci tidak dapat dibuka."
            exit 1
          fi
          echo "OK: Password kunci privat diterima."
          echo "HASIL: Keystore siap digunakan untuk signing."
